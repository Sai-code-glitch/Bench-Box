name: ci

on:
  push:
  pull_request:

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log || {
            echo "::error title=npm ci failed::$(tail -n 25 install.log | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
      - name: Unit tests (cart, orders, build-your-own box)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            echo "::error title=tests failed::$(grep -E 'not ok|Error|assert|expected|actual' test.log | head -n 30 | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
      - name: Bundle the app (catches import and syntax errors in every screen)
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir dist 2>&1 | tee bundle.log || {
            echo "::error title=bundle failed::$(grep -iE 'error|unable|cannot|failed' bundle.log | head -n 20 | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
