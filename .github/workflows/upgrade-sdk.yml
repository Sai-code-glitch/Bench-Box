name: upgrade-expo-sdk

# One-time job: installs the SDK 57 peer packages expo-doctor asked for,
# verifies everything, commits the lockfile, then removes itself.
on:
  push:
    branches: [claude/overnight-benchbox]
    paths: [.github/workflows/upgrade-sdk.yml]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/overnight-benchbox
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current dependencies
        run: npm ci
      - name: Add missing SDK 57 packages
        run: |
          set -o pipefail
          npx expo install expo-font react-native-worklets expo-splash-screen 2>&1 | tee upgrade.log || {
            echo "::error title=install failed::$(tail -n 25 upgrade.log | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
      - name: Expo doctor (must pass)
        run: |
          set -o pipefail
          npx expo-doctor 2>&1 | tee doctor.log || {
            echo "::error title=expo-doctor::$(tail -n 25 doctor.log | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
      - name: Unit tests
        run: npm test
      - name: Bundle check (android and ios)
        run: |
          set -o pipefail
          { npx expo export --platform android --output-dir dist && npx expo export --platform ios --output-dir dist-ios; } 2>&1 | tee bundle.log || {
            echo "::error title=bundle failed::$(grep -iE 'error|unable|cannot|failed' bundle.log | head -n 20 | tr '\n' ' ' | cut -c1-3500)"; exit 1; }
      - name: Commit
        run: |
          git config user.name "Sai-code-glitch"
          git config user.email "saijagan.yalamanchili7@gmail.com"
          git rm -q .github/workflows/upgrade-sdk.yml
          git add package.json package-lock.json
          git commit -m "Add expo-font, react-native-worklets and expo-splash-screen for SDK 57"
          git push origin HEAD:claude/overnight-benchbox
